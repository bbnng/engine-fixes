; Engine Fixes 1.0.0 settings. Restart the game after changing anything.
; 1 = on, 0 = off. A missing setting uses the value shown here.

[Effects]
; Remove Discipline effects (e.g. Presence's golden halo) left floating after the
; character they were attached to is gone.
orphan_particles=1

[Eyes]
; Stop NPC eyes twitching the wrong way for one frame whenever they look somewhere new.
eye_target_interpolation=1

[NPCAnimation]
; Fixes and smoothing tweaks for NPC walking and idle animation "jolts".
; Let idle fidgets finish instead of being cut off and swapped mid-animation.
idle_sequence_consistency=1
; Keep the walk cycle going when an NPC stops and restarts in the same instant.
same_tick_walk_phase=1
; Stop NPCs from using the player character's idle animations.
npc_idle_pool=1
; Blend the legs when an NPC changes walking direction (the game ships with a debug snap on).
npc_move_yaw_blend=1
; Smooth NPC steering around each other and obstacles: no zig-zag, sidestep flicks or stalls.
npc_steering_damping=1
; Limit how fast the legs' walking-direction blend may change.
npc_move_yaw_smoothing=1
; Blend leg movement smoothly between AI updates instead of in 10-per-second steps.
npc_pose_interpolation=1

; ---------------------------------------------------------------------------------------------
; NPC eye glances in dialogue
; During dialogue, NPCs glance away from you every few seconds and then look back. In the
; unmodded game these glances move the eyes slowly (that slow sweep is the "eye roll") and go
; up, down or sideways with equal odds. These options reshape them.
; Each NPC mood ("disposition" in vdata/system/dispositiontable.txt) defines its glances. Most
; moods pick a random direction; a few have hand-made glances (e.g. Apathy's slow, bored roll
; up-left, up, up-right). The options below change the random ones; see keep_authored_glances.
; 0 for a number means "use the game's own value".
; ---------------------------------------------------------------------------------------------
[EyeGlances]
; 1 = reshape glances with the options below, 0 = leave glances exactly as the game has them.
enabled=1
; 1 = NPCs glance away now and then; 0 = no random glances at all, they keep looking at you.
; (To also stop the hand-made glances, set keep_authored_glances=0 as well.)
glances=1
; 1 = moods with hand-made glances (Apathy, Confused, Disgust, Anger, PrinceSitting, Damaged) keep
; them exactly as authored; 0 = give them the random glances below too.
keep_authored_glances=1
; How fast the eyes move during a glance: the share of the remaining way covered every 0.1 s.
; Game: 0.3 (the slow "roll"). 0.9 = the normal gaze speed (quick dart), 1.0 = instant. Lower = gentler.
turn_rate=0.1
; How far a glance looks away from where the head points, in degrees (diagonals about 1.4x this).
; Game: 20. Lower = subtler glances.
angle=14
; Seconds between glances (picked at random between min and max). Game: 5 to 8.
interval_min=8
interval_max=14
; How long a glance holds before the eyes return to you, in seconds. Game: 0.15 to 0.25.
hold_min=0.35
hold_max=0.7
; Relative odds of each glance direction (only the ratios matter; game: all equal).
; weight_side applies to left and to right, each diagonal weight to both of its diagonals.
; Set a weight to 0 to never glance that way (e.g. weight_side=0: no left/right glances).
weight_side=4
weight_down=1
weight_down_diagonal=0.5
weight_up=0.25
weight_up_diagonal=0.25
; Straight ahead along the head (not at you).
weight_ahead=0
