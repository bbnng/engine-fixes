; Engine Fixes and Tweaks 1.2.1 - settings
;
; 1 = on, 0 = off. Restart the game after changing anything.
; If a setting is missing, the value shown here is used, except in [Startup] and [Loading],
; where a missing setting is off.

; =============================================================================================
;  FIXES - bugs in the game itself. Best left on.
; =============================================================================================
[Fixes]

; --- Crashes -----------------------------------------------------------------------------------

; The game can crash when the engine restarts (the console's _restart command, or changing some
; video settings) after you have played. This fix prevents that crash.
restart_crash=1

; --- Effects -----------------------------------------------------------------------------------

; Removes Discipline effects that stay floating after their owner is gone, such as Presence's
; golden halo staying on a vampire after it dies.
orphan_particles=1

; --- Eyes --------------------------------------------------------------------------------------

; Whenever an NPC looks somewhere new, the game first moves its eyes the wrong way for a split
; second. This fix stops that twitch.
eye_target_interpolation=1

; --- NPC animation -----------------------------------------------------------------------------

; Lets NPC idle animations (fidgets, shifting weight) play to the end instead of being cut off
; halfway, which made the NPC snap into another pose and back.
idle_sequence_consistency=1

; Stops the walk cycle from restarting with a visible hitch when an NPC stops and starts walking
; again in the same moment.
same_tick_walk_phase=1

; Stops NPCs from using the player character's idle animations.
npc_idle_pool=1

; The game ships with a debug setting switched on that makes NPC legs snap to a new walking
; direction. This turns it off so the legs blend smoothly into the new direction.
npc_move_yaw_blend=1

; The game updates NPC leg movement only 10 times a second, so it looks choppy next to the rest
; of the body. This blends it smoothly every frame.
npc_pose_interpolation=1

; =============================================================================================
;  SPEED - faster startup and loading. Best left on.
; =============================================================================================
; Each checks the game code it speeds up and switches itself off if a patch changed it.
; They don't change what the game loads, only how fast it finds it. While on, they write a
; few timing lines to Bin\loader\blse\blse.log for each startup and load.
[Startup]

; Needed by every speed setting in [Startup] and [Loading]. 0 = all of them off.
startup_trace=1

; Startup: the game's data tables are built without walking every list to its end.
startup_table_append=1

; Startup: each sound-scheme folder is listed once instead of twice.
startup_sound_schemes=1
startup_sound_scheme_cache=1

; Startup: builds a quick index of the game's .vpk packs, so looking for files in them doesn't
; search every pack from start to end. Also needed by server_sound_tables and
; sound_precache_index below.
startup_pack_prefix=1

[Loading]

; Needed by every speed setting in this section. 0 = all of them off.
loading_trace=1

; The first save you load in a session: the game's sound tables are built with the pack index
; (about 2 seconds faster).
server_sound_tables=1

; Every load: the sound folders the game lists are searched with the pack index.
sound_precache_index=1

; Every load: checks for files that aren't there are answered faster.
loose_stat_fast=1

; Every load: models that are already loaded are found faster.
model_name_cache=1

; The end of every load, before you can play: the game exchanges the new area's data with
; itself at most 65 times a second. This raises that limit to the given number while the area
; is not running yet, so the last part of the load is shorter. Your frame rate in play is not
; changed. 0 = the game's limit.
signon_fps_max=300

; Detailed measurements of each load, for troubleshooting only. Slows loading slightly.
restore_trace=0
entity_trace=0
entity_sampler=0

; =============================================================================================
;  TWEAKS - optional changes to how things look and move. Turn off any you don't like.
; =============================================================================================
[Tweaks]

; --- NPC movement ------------------------------------------------------------------------------

; Smoother walking around other people and obstacles: NPCs no longer zig-zag, flick into a
; sidestep or backpedal, or stop for a moment.
npc_steering_damping=1

; Limits how fast an NPC's legs can swing to a new walking direction, so turns look natural.
npc_move_yaw_smoothing=1

; --- Knox --------------------------------------------------------------------------------------

; Knox Gorman's eyes are opened very wide, so he seems to stare. This relaxes his upper eyelids.
; Blinking, eye movement, brows and lip-sync are unchanged; expressions that widen his eyes
; (such as surprise) are a bit weaker too.
knox_relaxed_eyes=1

; How wide Knox's eyes open: 1 = as in the game, 0 = no widening at all. Default 0.3.
knox_lid_raiser_scale=0.3

; --- Dialogue eye glances (settings below) -----------------------------------------------------
;
; In dialogue, NPCs glance away from you every few seconds and then look back. In the game these
; glances are slow sweeps up, down or sideways, which look like eye rolls. By default this tweak
; makes them gentler, less frequent and mostly sideways. Every part can be adjusted below.
[EyeGlances]

; 1 = use the glance settings below; 0 = leave glances exactly as in the game.
enabled=1

; 1 = NPCs glance away now and then; 0 = no glances, NPCs keep looking at you.
glances=1

; A few moods have their own hand-made glances, for example Apathy's bored eye roll.
; 1 = keep those as made; 0 = give them the glances set up below too.
keep_authored_glances=1

; Eye speed during a glance. Lower = slower, gentler movement.
; 0.1 = gentle (default), 0.3 = the game's slow sweep, 0.9 = a quick dart, 1 = instant.
turn_rate=0.1

; How far a glance looks away, in degrees. The game uses 20. Lower = subtler.
angle=14

; Seconds between glances, chosen at random between min and max. The game uses 5 to 8.
interval_min=8
interval_max=14

; How many seconds a glance lasts before the eyes come back. The game uses 0.15 to 0.25.
hold_min=0.35
hold_max=0.7

; How often each direction is picked, compared with the others (the game picks all equally).
; A higher number means that direction comes up more often; 0 = never look that way.
weight_side=4
weight_down=1
weight_down_diagonal=0.5
weight_up=0.25
weight_up_diagonal=0.25
; Straight ahead (where the head points, not at you).
weight_ahead=0
