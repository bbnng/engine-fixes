; Engine Fixes and Tweaks 1.3 - startup companion (engine_fixes_intro.vtm) settings
;
; Gets you to the main menu faster: the game starts loading at once instead of after the logo
; videos, and the window stays dark while it loads instead of showing a grey or white window.
; Works in windowed mode. In full screen, or if a patch changed the engine code it uses, it
; does nothing and the game starts as usual.
; Restart the game after changing anything.
[IntroFirst]

; 1 = on; 0 = off, the game starts exactly as without this file.
enabled=1

; 1 = skip the logo videos at startup; 0 = play them (they can still be skipped with a key).
skip_videos=1

; Only matters with skip_videos=0: 1 = if you start the game with -novid, the videos stay
; skipped as the game does it; 0 = this companion handles startup anyway.
honor_novid=1
